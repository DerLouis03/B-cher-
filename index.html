<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Bücherregal</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1b2a41;--mute:#6b778a;--line:#d9dfe8;--gold:#e0a526;--plum:#6d2e46}
@media(prefers-color-scheme:dark){:root{--bg:#141b27;--card:#1d2738;--ink:#e8edf5;--mute:#93a0b5;--line:#2c394f;--gold:#f0b83a;--plum:#c9708f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:20px}
h1{margin:0;font-size:2rem;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.9rem}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.ic:focus-visible,.star:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
.row{display:grid;grid-template-columns:44px 72px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.rank{font-size:1.9rem;font-weight:bold;color:var(--gold);text-align:center}
.cover{width:72px;height:104px;object-fit:cover;border-radius:3px 6px 6px 3px;box-shadow:inset 4px 0 0 rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.25);background:var(--plum);display:grid;place-items:center;color:#fff;font-size:1.8rem}
.info{min-width:0;cursor:pointer}
.info b{display:block;font-size:1.05rem;overflow-wrap:anywhere}
.info span{color:var(--mute);font-size:.9rem}
.stars{color:var(--gold);letter-spacing:2px;white-space:nowrap}
.note{color:var(--mute);font-size:.88rem;font-style:italic;margin-top:4px}
.ctrl{display:flex;flex-direction:column;gap:4px}
.ic{background:transparent;border:1px solid var(--line);border-radius:6px;width:32px;height:30px;cursor:pointer}
.ic:disabled{opacity:.3;cursor:default}
.empty{text-align:center;color:var(--mute);padding:48px 16px;border:2px dashed var(--line);border-radius:12px}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--ink);width:min(480px,94vw);padding:22px}
dialog::backdrop{background:rgba(10,15,25,.6)}
label{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 4px}
input[type=text],input[type=date],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.pick{display:flex;gap:14px;align-items:center}
.pick .cover{flex:none}
.starpick{display:flex;gap:2px}
.star{background:none;border:0;font-size:1.8rem;color:var(--line);cursor:pointer;padding:0 2px}
.star.on{color:var(--gold)}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:20px}
.del{color:#b3261e;border-color:#b3261e}
@media(max-width:520px){.row{grid-template-columns:32px 56px 1fr auto;gap:10px}.cover{width:56px;height:82px}.rank{font-size:1.4rem}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Mein Bücherregal</h1><div class="sub" id="count"></div></div>
    <button class="btn" id="add">Buch hinzufügen</button>
  </header>
  <div class="bar">
    <label for="sort" style="margin:0">Sortierung</label>
    <select id="sort">
      <option value="rank">Meine Rangliste</option>
      <option value="stars">Sterne</option>
      <option value="date">Zuletzt gelesen</option>
    </select>
    <span style="flex:1"></span>
    <button class="btn ghost" id="exp">Exportieren</button>
    <button class="btn ghost" id="imp">Importieren</button>
    <input type="file" id="impfile" accept="application/json" hidden>
  </div>
  <div id="list"></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <div class="pick">
      <div class="cover" id="prev">📖</div>
      <div>
        <button type="button" class="btn ghost" id="pickbtn">Cover wählen</button>
        <input type="file" id="coverfile" accept="image/*" hidden>
      </div>
    </div>
    <label for="title">Titel</label><input type="text" id="title" required>
    <label for="author">Autor</label><input type="text" id="author">
    <label>Bewertung</label><div class="starpick" id="starpick"></div>
    <label for="date">Gelesen am</label><input type="date" id="date">
    <label for="notes">Notiz</label><textarea id="notes" rows="3"></textarea>
    <div class="actions">
      <button type="button" class="btn ghost del" id="del">Löschen</button>
      <span style="display:flex;gap:8px">
        <button type="button" class="btn ghost" id="cancel">Abbrechen</button>
        <button type="submit" class="btn">Speichern</button>
      </span>
    </div>
  </form>
</dialog>

<script>
const KEY = 'buecher-v1';
let books = [];
try { books = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { books = []; }
const $ = id => document.getElementById(id);
let editId = null, cover = '', stars = 0;

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(books)); }
  catch (e) { alert('Speichern fehlgeschlagen (Speicher voll?). Exportiere deine Daten als Backup.'); }
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const starText = n => '★'.repeat(n) + '☆'.repeat(5 - n);

function render() {
  const mode = $('sort').value;
  let view = [...books];
  if (mode === 'stars') view.sort((a, b) => b.stars - a.stars);
  if (mode === 'date') view.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  $('count').textContent = books.length + (books.length === 1 ? ' Buch gelesen' : ' Bücher gelesen');
  if (!books.length) {
    $('list').innerHTML = '<div class="empty">Noch kein Buch im Regal.<br>Füge dein erstes gelesenes Buch hinzu.</div>';
    return;
  }
  $('list').innerHTML = view.map((b, i) => {
    const idx = books.indexOf(b), manual = mode === 'rank';
    const img = b.cover
      ? `<img class="cover" src="${b.cover}" alt="Cover von ${esc(b.title)}">`
      : `<div class="cover">${esc(b.title.charAt(0).toUpperCase())}</div>`;
    return `<div class="row">
      <div class="rank">${i + 1}</div>${img}
      <div class="info" data-edit="${b.id}">
        <b>${esc(b.title)}</b>
        <span>${esc(b.author)}${b.date ? ' · ' + new Date(b.date).toLocaleDateString('de-DE') : ''}</span>
        <div class="stars" aria-label="${b.stars} von 5 Sternen">${starText(b.stars)}</div>
        ${b.notes ? `<div class="note">${esc(b.notes)}</div>` : ''}
      </div>
      <div class="ctrl">
        <button class="ic" data-up="${b.id}" ${!manual || idx === 0 ? 'disabled' : ''} aria-label="Nach oben">▲</button>
        <button class="ic" data-down="${b.id}" ${!manual || idx === books.length - 1 ? 'disabled' : ''} aria-label="Nach unten">▼</button>
      </div></div>`;
  }).join('');
}

function move(id, d) {
  const i = books.findIndex(b => b.id === id), j = i + d;
  if (j < 0 || j >= books.length) return;
  [books[i], books[j]] = [books[j], books[i]];
  save(); render();
}

$('list').addEventListener('click', e => {
  const t = e.target.closest('[data-up],[data-down],[data-edit]');
  if (!t) return;
  if (t.dataset.up) move(t.dataset.up, -1);
  else if (t.dataset.down) move(t.dataset.down, 1);
  else openDialog(t.dataset.edit);
});
$('sort').onchange = render;

function setStars(n) {
  stars = n;
  $('starpick').innerHTML = [1,2,3,4,5].map(i =>
    `<button type="button" class="star ${i <= n ? 'on' : ''}" data-s="${i}" aria-label="${i} Sterne">★</button>`).join('');
}
$('starpick').addEventListener('click', e => {
  const s = e.target.closest('[data-s]'); if (s) setStars(stars === +s.dataset.s ? 0 : +s.dataset.s);
});
function setPreview() {
  $('prev').innerHTML = cover ? `<img src="${cover}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">` : '📖';
}
function openDialog(id) {
  const b = books.find(x => x.id === id);
  editId = b ? b.id : null;
  $('title').value = b ? b.title : '';
  $('author').value = b ? b.author : '';
  $('date').value = b ? b.date : new Date().toISOString().slice(0, 10);
  $('notes').value = b ? b.notes : '';
  cover = b ? b.cover : '';
  setStars(b ? b.stars : 0); setPreview();
  $('del').style.visibility = b ? 'visible' : 'hidden';
  $('dlg').showModal();
}
$('add').onclick = () => openDialog(null);
$('cancel').onclick = () => $('dlg').close();
$('pickbtn').onclick = () => $('coverfile').click();

// Cover verkleinern, damit der Browser-Speicher reicht
$('coverfile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const max = 360, r = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    cover = c.toDataURL('image/jpeg', 0.8);
    URL.revokeObjectURL(url); setPreview();
  };
  img.src = url; e.target.value = '';
};

$('form').addEventListener('submit', () => {
  const data = { title: $('title').value.trim(), author: $('author').value.trim(), stars, date: $('date').value, notes: $('notes').value.trim(), cover };
  if (!data.title) return;
  if (editId) Object.assign(books.find(b => b.id === editId), data);
  else books.push({ id: crypto.randomUUID(), ...data });
  save(); render();
});
$('del').onclick = () => {
  if (editId && confirm('Dieses Buch wirklich löschen?')) {
    books = books.filter(b => b.id !== editId); save(); render(); $('dlg').close();
  }
};

// Backup: Daten liegen nur in diesem Browser
$('exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(books)], { type: 'application/json' }));
  a.download = 'buecher-backup.json'; a.click();
};
$('imp').onclick = () => $('impfile').click();
$('impfile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    try {
      const d = JSON.parse(t);
      if (!Array.isArray(d)) throw 0;
      books = d; save(); render();
    } catch (err) { alert('Ungültige Datei.'); }
  });
  e.target.value = '';
};
render();
</script>
</body>
</html>
